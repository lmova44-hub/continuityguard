{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block breadcrumb %}Workspace <span>/</span> Error{% endblock %}
{% block content %}<section class="error-panel"><div class="error-code">{{ code }}</div><h1>Something interrupted your workflow.</h1><p>{{ message }}</p><a class="button button-primary" href="{{ url_for('dashboard') }}">Back to overview →</a></section>{% endblock %}
